<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="deepOcean" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b4965"/>
      <stop offset="60%" stop-color="#0f2b46"/>
      <stop offset="100%" stop-color="#071829"/>
    </radialGradient>
    <pattern id="wavePattern" width="80" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 Q 20 10 40 20 Q 60 30 80 20" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>
    </pattern>
  </defs>

  <!-- Deep Ocean Base -->
  <rect width="1000" height="1000" fill="url(#deepOcean)"/>
  <rect width="1000" height="1000" fill="url(#wavePattern)"/>

  <!-- Compass Rose Watermark (Subtle Nautical Theme) -->
  <g transform="translate(850, 150) scale(0.7)" opacity="0.15">
    <circle cx="0" cy="0" r="120" stroke="#ffffff" stroke-width="2" fill="none"/>
    <circle cx="0" cy="0" r="100" stroke="#ffffff" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
    <!-- North Point -->
    <polygon points="0,-120 16,-30 0,0" fill="#ffffff"/>
    <polygon points="0,-120 -16,-30 0,0" fill="rgba(255,255,255,0.4)"/>
    <!-- South Point -->
    <polygon points="0,120 -16,30 0,0" fill="#ffffff"/>
    <polygon points="0,120 16,30 0,0" fill="rgba(255,255,255,0.4)"/>
    <!-- East Point -->
    <polygon points="120,0 30,16 0,0" fill="#ffffff"/>
    <polygon points="120,0 30,-16 0,0" fill="rgba(255,255,255,0.4)"/>
    <!-- West Point -->
    <polygon points="-120,0 -30,-16 0,0" fill="#ffffff"/>
    <polygon points="-120,0 -30,16 0,0" fill="rgba(255,255,255,0.4)"/>
    <text x="0" y="-130" text-anchor="middle" font-family="Cinzel, serif" font-size="24" fill="#ffffff" font-weight="bold">N</text>
  </g>

  <!-- Wave Ring Highlights -->
  <circle cx="500" cy="500" r="420" stroke="rgba(98, 182, 203, 0.15)" stroke-width="3" fill="none" stroke-dasharray="24 16"/>
  <circle cx="500" cy="500" r="460" stroke="rgba(98, 182, 203, 0.08)" stroke-width="2" fill="none"/>
</svg>
