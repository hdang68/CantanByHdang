<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="pastureBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#95d5b2"/>
      <stop offset="50%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </radialGradient>
    <linearGradient id="grassGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#74c69d"/>
      <stop offset="100%" stop-color="#40916c"/>
    </linearGradient>
    <linearGradient id="grassGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#85d9a9"/>
      <stop offset="100%" stop-color="#52b788"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="300" fill="url(#pastureBg)"/>

  <!-- Back rolling hills -->
  <path d="M -20 160 Q 60 90 170 140 Q 240 100 330 150 L 330 300 L -20 300 Z" fill="url(#grassGrad1)"/>

  <!-- Foreground rolling hills -->
  <path d="M -30 210 Q 90 140 200 190 Q 260 170 330 220 L 330 300 L -30 300 Z" fill="url(#grassGrad2)"/>

  <!-- Little sheep silhouettes -->
  <!-- Sheep 1 (Center) -->
  <g transform="translate(130, 160)">
    <!-- Body -->
    <ellipse cx="20" cy="15" rx="14" ry="10" fill="#ffffff" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.2))"/>
    <circle cx="10" cy="14" r="7" fill="#ffffff"/>
    <circle cx="28" cy="13" r="6" fill="#ffffff"/>
    <circle cx="20" cy="7" r="7" fill="#ffffff"/>
    <!-- Head -->
    <ellipse cx="6" cy="11" rx="5" ry="4" fill="#2d3748"/>
    <!-- Legs -->
    <line x1="12" y1="22" x2="12" y2="30" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="22" x2="25" y2="30" stroke="#2d3748" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Sheep 2 (Small in background) -->
  <g transform="translate(60, 125) scale(0.65)">
    <ellipse cx="20" cy="15" rx="14" ry="10" fill="#ffffff"/>
    <circle cx="10" cy="14" r="7" fill="#ffffff"/>
    <circle cx="20" cy="7" r="7" fill="#ffffff"/>
    <ellipse cx="6" cy="11" rx="5" ry="4" fill="#2d3748"/>
    <line x1="12" y1="22" x2="12" y2="28" stroke="#2d3748" stroke-width="2.5"/>
    <line x1="25" y1="22" x2="25" y2="28" stroke="#2d3748" stroke-width="2.5"/>
  </g>

  <!-- Sheep 3 (Foreground Right) -->
  <g transform="translate(200, 210) scale(0.85)">
    <ellipse cx="20" cy="15" rx="14" ry="10" fill="#ffffff"/>
    <circle cx="10" cy="14" r="7" fill="#ffffff"/>
    <circle cx="26" cy="14" r="6" fill="#ffffff"/>
    <ellipse cx="32" cy="12" rx="5" ry="4" fill="#2d3748"/>
    <line x1="14" y1="22" x2="14" y2="30" stroke="#2d3748" stroke-width="2.5"/>
    <line x1="24" y1="22" x2="24" y2="30" stroke="#2d3748" stroke-width="2.5"/>
  </g>

  <!-- Wildflowers / grass blades details -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="45" cy="240" r="2.5"/>
    <circle cx="50" cy="245" r="2"/>
    <circle cx="110" cy="260" r="2.5"/>
    <circle cx="170" cy="275" r="2"/>
    <circle cx="260" cy="250" r="2.5"/>
  </g>
</svg>
