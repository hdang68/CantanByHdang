<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="desertBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#fba156"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="duneGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="duneGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="300" fill="url(#desertBg)"/>

  <!-- Desert Sun -->
  <circle cx="150" cy="70" r="28" fill="#ffedd5" opacity="0.6" filter="blur(1px)"/>

  <!-- Back Sand Dunes -->
  <path d="M -20 160 Q 80 110 180 150 Q 250 110 330 160 L 330 300 L -20 300 Z" fill="#9a3412" opacity="0.5"/>

  <!-- Middle Sand Dunes -->
  <path d="M -30 200 Q 70 140 180 180 Q 240 150 330 195 L 330 300 L -30 300 Z" fill="url(#duneGrad1)"/>

  <!-- Foreground Sand Dunes -->
  <path d="M 0 240 Q 110 170 220 220 Q 260 200 320 240 L 320 300 L 0 300 Z" fill="url(#duneGrad2)"/>

  <!-- Sand Ripples -->
  <path d="M 40 215 Q 80 205 120 215" stroke="#9a3412" stroke-width="1.8" fill="none" opacity="0.4"/>
  <path d="M 70 230 Q 120 220 170 230" stroke="#9a3412" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 160 250 Q 210 240 260 250" stroke="#7c2d12" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Small Cactus Silhouette -->
  <g transform="translate(190, 155) scale(0.75)" fill="#431407">
    <!-- Main stem -->
    <rect x="18" y="0" width="8" height="42" rx="4"/>
    <!-- Left arm -->
    <path d="M 8 16 L 18 16 L 18 22 L 10 22 Q 6 22 6 16 L 6 8 L 12 8 L 12 16 Z"/>
    <!-- Right arm -->
    <path d="M 24 22 L 34 22 L 34 14 L 28 14 L 28 8 L 36 8 L 36 14 Q 36 26 28 26 L 24 26 Z"/>
  </g>
</svg>
