<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <radialGradient id="mountainBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="rockGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="rockGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="300" fill="url(#mountainBg)"/>

  <!-- Left Mountain Peak -->
  <g transform="translate(0, 20)">
    <!-- Lit Side -->
    <polygon points="75,90 20,230 75,230" fill="url(#rockGrad1)"/>
    <!-- Shaded Side -->
    <polygon points="75,90 75,230 135,230" fill="url(#rockGrad2)"/>
    <!-- Snow Cap -->
    <polygon points="75,90 50,140 75,130 95,145" fill="#f8fafc"/>
  </g>

  <!-- Right Mountain Peak -->
  <g transform="translate(100, 30)">
    <!-- Lit Side -->
    <polygon points="120,80 60,225 120,225" fill="url(#rockGrad1)"/>
    <!-- Shaded Side -->
    <polygon points="120,80 120,225 180,225" fill="url(#rockGrad2)"/>
    <!-- Snow Cap -->
    <polygon points="120,80 95,135 120,125 145,140" fill="#f8fafc"/>
  </g>

  <!-- Main Center High Mountain Peak -->
  <g transform="translate(30, -10)">
    <!-- Lit Side -->
    <polygon points="120,55 45,230 120,230" fill="url(#rockGrad1)"/>
    <!-- Shaded Side -->
    <polygon points="120,55 120,230 195,230" fill="url(#rockGrad2)"/>
    <!-- Snow Cap -->
    <polygon points="120,55 85,120 120,105 155,125" fill="#ffffff" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.3))"/>
  </g>

  <!-- Ore Veins / Minerals sparkles -->
  <g fill="#38bdf8" opacity="0.8">
    <!-- Blue/silver ore crystals -->
    <polygon points="110,170 114,166 118,170 114,174"/>
    <polygon points="135,185 138,181 141,185 138,189"/>
    <polygon points="75,195 78,192 81,195 78,198"/>
    <polygon points="175,190 178,187 181,190 178,193"/>
  </g>

  <!-- Mountain base rocky terrain -->
  <path d="M 0 220 Q 150 200 300 220 L 300 300 L 0 300 Z" fill="#1e293b" opacity="0.6"/>
</svg>
