<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <radialGradient id="tableVignette" cx="50%" cy="50%" r="70%">
      <stop offset="30%" stop-color="#241913"/>
      <stop offset="70%" stop-color="#18100c"/>
      <stop offset="100%" stop-color="#0a0604"/>
    </radialGradient>
    <linearGradient id="woodPlankGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a271d" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#2a1b14" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#170e0a" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- Table Base -->
  <rect width="1920" height="1080" fill="url(#tableVignette)"/>

  <!-- Wood Planks Lines -->
  <g stroke="#140c08" stroke-width="2" opacity="0.6">
    <line x1="0" y1="180" x2="1920" y2="180"/>
    <line x1="0" y1="360" x2="1920" y2="360"/>
    <line x1="0" y1="540" x2="1920" y2="540"/>
    <line x1="0" y1="720" x2="1920" y2="720"/>
    <line x1="0" y1="900" x2="1920" y2="900"/>
  </g>

  <!-- Wood Grain Highlights -->
  <g stroke="rgba(255,255,255,0.02)" stroke-width="1.5" fill="none">
    <path d="M 0 90 Q 500 80 1000 95 Q 1500 110 1920 85"/>
    <path d="M 0 270 Q 600 285 1200 260 Q 1600 250 1920 275"/>
    <path d="M 0 450 Q 400 440 900 460 Q 1400 440 1920 455"/>
    <path d="M 0 630 Q 700 645 1300 620 Q 1700 630 1920 625"/>
    <path d="M 0 810 Q 500 795 1100 820 Q 1600 810 1920 815"/>
    <path d="M 0 990 Q 600 1005 1200 985 Q 1700 990 1920 995"/>
  </g>

  <!-- Warm Center Spotlight (Where board sits) -->
  <circle cx="960" cy="540" r="600" fill="rgba(230, 126, 34, 0.04)" filter="blur(40px)"/>
</svg>
